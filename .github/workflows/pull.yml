name: Pull league data

on:
  workflow_dispatch:        # "Run workflow" button for a manual pull
  schedule:
    - cron: "7 * * * *"             # every hour, all week
    - cron: "*/15 17-23 * * 0"      # Sunday games: every 15 min (10 AM to 5 PM Pacific)
    - cron: "*/15 0-4 * * 1"        # Sunday night game (5 to 10 PM Pacific)
    - cron: "*/15 0-4 * * 2"        # Monday night game
    - cron: "*/15 0-4 * * 5"        # Thursday night game

permissions:
  contents: write

concurrency:
  group: pull
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main                 # always start from the newest copy, not the one from when the run was queued
      - uses: actions/setup-node@v4
        with:
          node-version: 20
